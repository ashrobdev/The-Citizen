# Manual OVERRIDES for officeholders.
#
# Everything here is now sourced automatically:
#   - senators, representatives, President, Vice President
#       -> unitedstates/congress-legislators
#   - 50 governors, Speaker of the House, Chief Justice
#       -> Wikidata (see scripts/lib/wikidata.ts)
#
# This file exists to CORRECT those sources, not to supply them. An entry here
# wins over the automated value, so it is the escape hatch for when Wikidata is
# wrong, stale, or vandalised — which it can be, since anyone may edit it.
#
# LEAVE AN ENTRY EMPTY UNLESS YOU ARE CORRECTING SOMETHING. An empty entry with
# no automated value makes the app ask "did you get it right?" and point at
# uscis.gov, which is honest. A wrong name is far worse: it silently tells
# someone the wrong answer while they prepare for an interview.
#
# Verify against uscis.gov/citizenship/testupdates, which is the authority
# USCIS itself directs applicants to.

reviewedOn: '2026-08-16'

federal:
  # Q30 — "What is the name of the Speaker of the House of Representatives now?"
  # Sourced from Wikidata. Fill in only to override.
  speakerOfTheHouse:
    answers: []

  # Q57 — "Who is the Chief Justice of the United States now?"
  # Sourced from Wikidata. Fill in only to override.
  chiefJustice:
    answers: []

# Q61 — "Who is the governor of your state now?"
#
# All 50 come from Wikidata. Add an entry ONLY to override one, keyed by USPS
# code: `XX: ['Full Name', 'Surname']`.
#
# D.C. is intentionally absent — it has no governor, and the app answers that
# from data/static/jurisdictions.json.
governors: {}
