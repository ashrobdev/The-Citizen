name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Regenerates the question bank and fails if the committed output differs,
      # so assets/data/questions.json can never drift from its USCIS source.
      - name: Question bank is reproducible
        run: npm run check:questions

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      # Proves the app still bundles. Catches broken imports and bad native
      # module usage that typecheck and unit tests both miss.
      - name: Bundle
        run: npx expo export --platform ios --output-dir /tmp/expo-export
